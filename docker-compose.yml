# Just for local development: brings up a MySQL that matches the default
# datasource settings in application.yml
services:
  mysql:
    image: mysql:8.4
    container_name: resource-booking-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bookingdb
      MYSQL_USER: booking
      MYSQL_PASSWORD: booking
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    ports:
      - "3306:3306"
    volumes:
      - booking-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-ubooking", "-pbooking" ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  booking-db-data:
