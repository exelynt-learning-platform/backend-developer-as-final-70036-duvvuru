spring:
  application:
    name: resource-booking
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bookingdb?createDatabaseIfNotExist=true}
    username: root
    password: root123
  jpa:
    hibernate:
      # fine for an assignment/demo; a real deployment would use Flyway migrations
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    # dev-only default, always override with JWT_SECRET in real deployments.
    # Must be at least 32 characters (HS256 needs a >= 256-bit key).
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-prod-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
